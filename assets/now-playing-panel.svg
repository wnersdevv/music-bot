    <rect x="186" y="248" width="60" height="40" rx="8" fill="#404249"/>
    <text x="216" y="273" text-anchor="middle" fill="#ffffff">⏭️</text>

    <rect x="254" y="248" width="60" height="40" rx="8" fill="#da373c"/>
    <text x="284" y="273" text-anchor="middle" fill="#ffffff">⏹️</text>

    <rect x="322" y="248" width="60" height="40" rx="8" fill="#404249"/>
    <text x="352" y="273" text-anchor="middle" fill="#ffffff">🔀</text>
