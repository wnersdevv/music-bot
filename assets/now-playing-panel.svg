      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="620" height="360" rx="14" fill="url(#bg)"/>

  <!-- Discord top bar -->
  <rect x="0" y="0" width="620" height="46" rx="14" fill="#232428"/>
  <rect x="0" y="30" width="620" height="16" fill="#232428"/>
  <circle cx="28" cy="23" r="18" fill="#8b5cf6"/>
  <text x="28" y="28" font-family="Segoe UI, Arial" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">w</text>
  <text x="56" y="20" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#f2f3f5">wnersdev</text>
  <rect x="56" y="26" width="26" height="12" rx="3" fill="#5865F2"/>
  <text x="69" y="35" font-family="Segoe UI, Arial" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">BOT</text>
  <text x="56" y="40" font-family="Segoe UI, Arial" font-size="11" fill="#949ba4">Bugün 21:14</text>

  <!-- Container card (Components V2) -->
  <rect x="24" y="64" width="572" height="272" rx="12" fill="#2b2d31" stroke="url(#accent)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="24" y="64" width="6" height="272" rx="3" fill="url(#accent)"/>

  <!-- Header text -->
  <text x="50" y="98" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#a78bfa">🎵 ŞU AN ÇALIYOR</text>
  <text x="50" y="124" font-family="Segoe UI, Arial" font-size="19" font-weight="700" fill="#ffffff">Gece Yolculuğu — wnersdev Mix</text>
  <text x="50" y="146" font-family="Segoe UI, Arial" font-size="13" fill="#b5bac1">İsteyen: kankam#0001</text>

