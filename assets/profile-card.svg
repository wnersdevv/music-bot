<svg width="620" height="260" viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1033"/>
      <stop offset="100%" stop-color="#0f0620"/>
    </linearGradient>
    <linearGradient id="avatarRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="620" height="260" rx="16" fill="url(#cardbg)" filter="url(#shadow3)"/>

  <!-- avatar -->
  <circle cx="120" cy="130" r="78" fill="url(#avatarRing)"/>
  <circle cx="120" cy="130" r="70" fill="#2b2140"/>
  <text x="120" y="150" font-family="Segoe UI, Arial" font-size="60" text-anchor="middle">🎧</text>

  <!-- username -->
  <text x="230" y="88" font-family="Segoe UI, Arial" font-size="30" font-weight="700" fill="#ffffff">kankam#0001</text>

  <!-- stats -->
  <text x="230" y="130" font-family="Segoe UI, Arial" font-size="18" fill="#a78bfa">🎧 142 saat dinleme</text>
  <text x="230" y="162" font-family="Segoe UI, Arial" font-size="18" fill="#a78bfa">🎵 3.482 şarkı çalındı</text>
  <text x="230" y="194" font-family="Segoe UI, Arial" font-size="18" fill="#a78bfa">⭐ En çok dinlenen: Sezen Aksu</text>

  <text x="580" y="238" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="end">wnersdev</text>
</svg>
